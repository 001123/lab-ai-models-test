<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8fd4f6">
<meta name="description" content="Mô phỏng SVG hoa hướng dương lớn lên từ hạt: nảy mầm, vươn cao, kết nụ và nở rộ.">
<title>Hướng Dương — Từ hạt đến nở hoa</title>
<style>
  :root{
    --ink:#20301f;
    --cream:#fff6e3;
    --gold:#ffd25e;
    --gold-2:#f3b02a;
    --panel:rgba(24,18,10,.62);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;background:#8fd4f6;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  .scene{position:fixed;inset:0;overflow:hidden}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- HUD ---------- */
  .hud{
    position:absolute;z-index:3;
    top:clamp(20px,4.6vh,54px);
    left:clamp(18px,4.6vw,72px);
    max-width:min(430px,46vw);
    pointer-events:none;
    animation:introUp 1.2s cubic-bezier(.2,.7,.2,1) .15s;
  }
  @keyframes introUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .brand{
    display:flex;align-items:center;gap:10px;
    font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
    color:#27442b;opacity:.9;
  }
  .brand .mark{width:19px;height:19px;flex:none;animation:spin 30s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    font-weight:600;font-size:clamp(40px,5.2vw,72px);line-height:.96;letter-spacing:-.02em;
    margin:16px 0 12px;color:#1b3320;
    text-shadow:0 1px 0 rgba(255,255,255,.28);
  }
  h1 em{font-style:italic;color:#a86a12}
  .lede{
    margin:0;max-width:36ch;
    font-size:clamp(13px,1.05vw,15px);line-height:1.62;
    color:#33452c;opacity:.92;
  }
  .caption{
    margin:16px 0 0;max-width:38ch;min-height:2.9em;
    font-size:12.5px;line-height:1.55;font-style:italic;
    color:#465237;opacity:.85;transition:opacity .28s ease;
  }

  /* ---------- Dock ---------- */
  .dock{
    position:absolute;z-index:4;left:50%;bottom:clamp(14px,3.2vh,38px);
    transform:translateX(-50%);
    width:min(900px,calc(100% - 28px));
    animation:introUp 1.2s cubic-bezier(.2,.7,.2,1) .35s;
  }
  .dock::before{
    content:"";position:absolute;inset:-70px -4% -40px;pointer-events:none;z-index:-1;
    background:radial-gradient(65% 100% at 50% 100%,rgba(16,11,4,.5),rgba(16,11,4,0) 72%);
  }
  .stages{
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
    gap:clamp(8px,2vw,26px);margin-bottom:12px;
  }
  .stage-item{
    appearance:none;background:none;border:0;padding:4px 2px;
    display:inline-flex;align-items:center;gap:7px;
    font:inherit;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,246,227,.52);cursor:pointer;
    transition:color .25s ease;
  }
  .stage-item .dot{
    width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45;
    transition:all .25s ease;
  }
  .stage-item:hover{color:rgba(255,246,227,.85)}
  .stage-item.done{color:rgba(255,240,200,.72)}
  .stage-item.active{color:var(--gold)}
  .stage-item.active .dot{opacity:1;background:var(--gold);box-shadow:0 0 10px rgba(255,210,94,.9)}
  .stage-item:focus-visible{outline:1px solid rgba(255,210,94,.7);outline-offset:4px;border-radius:4px}

  .bar{
    display:flex;align-items:center;gap:clamp(8px,1.4vw,14px);
    padding:9px 14px;border-radius:999px;
    background:var(--panel);
    border:1px solid rgba(255,214,120,.22);
    backdrop-filter:blur(16px) saturate(1.2);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);
    box-shadow:0 22px 50px -18px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .btn{
    appearance:none;flex:none;width:38px;height:38px;border-radius:50%;
    display:grid;place-items:center;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.07);color:#ffe9b8;cursor:pointer;
    transition:background .2s ease,border-color .2s ease,transform .12s ease,filter .2s ease;
  }
  .btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,214,120,.4)}
  .btn:active{transform:scale(.94)}
  .btn:focus-visible{outline:2px solid rgba(255,210,94,.75);outline-offset:2px}
  .btn.play{
    background:linear-gradient(160deg,#ffe491,#f3b02a);
    color:#3a2506;border-color:rgba(255,220,120,.7);
    box-shadow:0 4px 18px rgba(243,176,42,.35);
  }
  .btn.play:hover{filter:brightness(1.06)}
  .btn .ic{width:18px;height:18px;display:block}
  .btn .ic-pause{display:none}
  .btn.playing .ic-pause{display:block}
  .btn.playing .ic-play{display:none}

  .track{
    position:relative;flex:1;height:30px;display:flex;align-items:center;
    cursor:pointer;touch-action:none;outline:none;
  }
  .rail{position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2.5px;border-radius:99px;background:rgba(255,255,255,.14)}
  .fill{
    position:absolute;left:0;top:50%;height:5px;margin-top:-2.5px;width:0;border-radius:99px;
    background:linear-gradient(90deg,#f3b02a,#ffe9a1);
    box-shadow:0 0 14px rgba(255,210,94,.5);
  }
  .thumb{
    position:absolute;top:50%;left:0;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;
    border-radius:50%;background:#fff8e4;border:2px solid #eda61e;
    box-shadow:0 0 0 4px rgba(255,210,94,.16),0 4px 10px rgba(0,0,0,.45);
    transition:box-shadow .2s ease;
  }
  .track:hover .thumb{box-shadow:0 0 0 6px rgba(255,210,94,.22),0 4px 10px rgba(0,0,0,.45)}
  .track:focus-visible .thumb{box-shadow:0 0 0 6px rgba(255,210,94,.4),0 4px 10px rgba(0,0,0,.45)}
  .pct{flex:none;min-width:44px;text-align:right;font-size:12px;font-weight:600;letter-spacing:.06em;color:#ffe9b8;font-variant-numeric:tabular-nums}
  .day{flex:none;font-size:11.5px;letter-spacing:.04em;color:rgba(255,246,227,.62);font-variant-numeric:tabular-nums;white-space:nowrap}
  .day b{color:#ffe9b8;font-weight:600}

  /* ---------- pollen motes ---------- */
  .mote{animation:moteFloat var(--dur) linear var(--delay) infinite;opacity:0;will-change:transform,opacity}
  @keyframes moteFloat{
    0%{transform:translate(0,0) scale(.5);opacity:0}
    10%{opacity:.9}
    62%{opacity:.55}
    100%{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}
  }

  /* ---------- responsive ---------- */
  @media (max-width:760px){
    .hud{
      top:14px;left:14px;max-width:calc(100% - 28px);
      padding:13px 15px 11px;border-radius:20px;
      background:linear-gradient(160deg,rgba(255,252,242,.87),rgba(255,250,235,.52));
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      box-shadow:0 14px 40px -12px rgba(24,40,16,.28);
    }
    h1{font-size:clamp(30px,8.4vw,40px);margin:8px 0 6px}
    .lede{display:none}
    .caption{display:none}
    .brand{font-size:9px;letter-spacing:.18em}
    .brand .mark{width:16px;height:16px}
    .stages{gap:8px 10px;margin-bottom:9px}
    .stage-item{font-size:9px;letter-spacing:.08em;gap:5px}
    .dock{bottom:12px;width:calc(100% - 20px)}
    .bar{padding:8px 10px;gap:7px}
    .btn{width:34px;height:34px}
    .day{display:none}
    .pct{min-width:38px;font-size:11px}
  }
  @media (max-height:640px) and (min-width:761px){
    .stages{display:none}
  }
  @media (max-height:620px) and (min-width:761px){
    .hud{max-width:38vw}
    h1{font-size:clamp(34px,4.4vw,52px)}
    .lede{display:none}
  }
  @media (prefers-reduced-motion: reduce){
    .brand .mark,.mote{animation:none !important}
    .mote{opacity:0}
  }
</style>
</head>
<body>
<div class="scene">
  <svg id="scene" viewBox="0 0 1100 760" preserveAspectRatio="xMidYMid slice"
       role="img" aria-label="Mô phỏng hoa hướng dương lớn lên từ hạt dưới lòng đất, vươn cao và nở rộ dưới nắng.">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3fa9e8"/>
        <stop offset=".34" stop-color="#8fd4f6"/>
        <stop offset=".62" stop-color="#cdeedb"/>
        <stop offset=".83" stop-color="#f2ecc4"/>
        <stop offset="1" stop-color="#f7e2a8"/>
      </linearGradient>
      <radialGradient id="sunGlow" gradientUnits="userSpaceOnUse" cx="940" cy="150" r="255">
        <stop offset="0" stop-color="#fff7c9" stop-opacity=".95"/>
        <stop offset=".24" stop-color="#ffe98d" stop-opacity=".6"/>
        <stop offset=".58" stop-color="#ffe07a" stop-opacity=".18"/>
        <stop offset="1" stop-color="#ffe07a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="sunCore" cx=".42" cy=".38" r=".66">
        <stop offset="0" stop-color="#fffdf2"/>
        <stop offset=".55" stop-color="#ffe98d"/>
        <stop offset="1" stop-color="#ffcf47"/>
      </radialGradient>
      <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7a5433"/>
        <stop offset=".12" stop-color="#5f3f24"/>
        <stop offset=".55" stop-color="#472c17"/>
        <stop offset="1" stop-color="#2c1a0d"/>
      </linearGradient>
      <linearGradient id="topsoil" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8a6238"/>
        <stop offset="1" stop-color="#6b4726"/>
      </linearGradient>
      <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#24501b"/>
        <stop offset=".42" stop-color="#4f9134"/>
        <stop offset=".68" stop-color="#68aa45"/>
        <stop offset="1" stop-color="#2c5e20"/>
      </linearGradient>
      <linearGradient id="leafGrad" x1="0" y1="0" x2=".9" y2="1">
        <stop offset="0" stop-color="#3c7a22"/>
        <stop offset=".5" stop-color="#5da336"/>
        <stop offset="1" stop-color="#8ac455"/>
      </linearGradient>
      <linearGradient id="petalGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe98f"/>
        <stop offset=".45" stop-color="#ffd04a"/>
        <stop offset=".85" stop-color="#f7b21c"/>
        <stop offset="1" stop-color="#e89a0c"/>
      </linearGradient>
      <linearGradient id="petalGradIn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe177"/>
        <stop offset=".5" stop-color="#ffc33a"/>
        <stop offset="1" stop-color="#e08c08"/>
      </linearGradient>
      <radialGradient id="discGrad" cx=".45" cy=".42" r=".64">
        <stop offset="0" stop-color="#8a5a24"/>
        <stop offset=".45" stop-color="#5a3413"/>
        <stop offset="1" stop-color="#2a1409"/>
      </radialGradient>
      <radialGradient id="flowerGlow" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="215">
        <stop offset="0" stop-color="#ffd25e" stop-opacity=".5"/>
        <stop offset=".45" stop-color="#ffd25e" stop-opacity=".16"/>
        <stop offset="1" stop-color="#ffd25e" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="budGrad" cx=".38" cy=".3" r=".85">
        <stop offset="0" stop-color="#a7d06a"/>
        <stop offset=".6" stop-color="#5f9a35"/>
        <stop offset="1" stop-color="#35651f"/>
      </radialGradient>
      <radialGradient id="seedHalo">
        <stop offset="0" stop-color="#ffdf9e" stop-opacity=".55"/>
        <stop offset=".55" stop-color="#ffcf7a" stop-opacity=".16"/>
        <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="seedGrad" cx=".35" cy=".3" r=".85">
        <stop offset="0" stop-color="#a87a4c"/>
        <stop offset=".5" stop-color="#6f4a29"/>
        <stop offset="1" stop-color="#3b2413"/>
      </radialGradient>
      <radialGradient id="vignette" cx=".5" cy=".42" r=".76">
        <stop offset=".55" stop-color="#0a1408" stop-opacity="0"/>
        <stop offset="1" stop-color="#0a1408" stop-opacity=".34"/>
      </radialGradient>
      <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
        <feGaussianBlur stdDeviation="5"/>
      </filter>
      <filter id="blurSmall" x="-60%" y="-160%" width="220%" height="420%">
        <feGaussianBlur stdDeviation="3"/>
      </filter>
      <path id="beePath" fill="none" d="M470 330 C 398 236 512 146 638 186 C 762 226 792 338 702 402 C 610 466 498 424 470 330"/>
      <path id="beePath2" fill="none" d="M660 410 C 720 348 800 360 812 420 C 824 480 744 512 686 480 C 640 454 640 430 660 410"/>
    </defs>

    <!-- sky -->
    <rect x="-900" y="-150" width="2800" height="1050" fill="url(#sky)"/>
    <ellipse cx="520" cy="540" rx="980" ry="170" fill="#ffe7a6" opacity=".22"/>

    <!-- sun -->
    <g id="sun">
      <circle cx="940" cy="150" r="255" fill="url(#sunGlow)"/>
      <g id="sunRays" stroke="#ffeaa3" stroke-width="2.2" stroke-linecap="round" opacity=".42">
        <animateTransform attributeName="transform" type="rotate" from="0 940 150" to="360 940 150" dur="240s" repeatCount="indefinite"/>
      </g>
      <circle cx="940" cy="150" r="58" fill="url(#sunCore)"/>
      <circle cx="940" cy="150" r="58" fill="none" stroke="#fff8d8" stroke-width="1.6" opacity=".55"/>
    </g>

    <!-- clouds -->
    <g id="clouds" filter="url(#soft)" opacity=".94">
      <g transform="translate(230 330)">
        <g>
          <ellipse cx="0" cy="0" rx="64" ry="22" fill="#fff" opacity=".95"/>
          <ellipse cx="-42" cy="9" rx="34" ry="15" fill="#fff" opacity=".78"/>
          <ellipse cx="40" cy="-7" rx="46" ry="20" fill="#fff" opacity=".85"/>
          <ellipse cx="4" cy="-14" rx="30" ry="16" fill="#fff" opacity=".8"/>
          <animateTransform attributeName="transform" type="translate" values="0 0; 36 0; 0 0" dur="72s" repeatCount="indefinite"/>
        </g>
      </g>
      <g transform="translate(452 70)">
        <g>
          <ellipse cx="0" cy="0" rx="44" ry="15" fill="#fff" opacity=".82"/>
          <ellipse cx="-26" cy="7" rx="24" ry="11" fill="#fff" opacity=".66"/>
          <ellipse cx="28" cy="-5" rx="28" ry="12" fill="#fff" opacity=".72"/>
          <animateTransform attributeName="transform" type="translate" values="0 0; -26 0; 0 0" dur="88s" repeatCount="indefinite"/>
        </g>
      </g>
      <g transform="translate(806 208)">
        <g>
          <ellipse cx="0" cy="0" rx="36" ry="10" fill="#fff" opacity=".6"/>
          <ellipse cx="-21" cy="4" rx="19" ry="7" fill="#fff" opacity=".48"/>
          <animateTransform attributeName="transform" type="translate" values="0 0; 22 2; 0 0" dur="64s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- birds -->
    <g id="birds" fill="none" stroke="#4d6350" stroke-width="2" stroke-linecap="round" opacity=".45">
      <g>
        <animateTransform attributeName="transform" type="translate" values="-200 0; 1300 0" dur="68s" repeatCount="indefinite"/>
        <g transform="translate(0 300)">
          <path d="M0 0 q 6 -5 12 0 q 6 -5 12 0"/>
          <path d="M22 -12 q 4.5 -3.6 9 0 q 4.5 -3.6 9 0" opacity=".8"/>
        </g>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="-200 0; 1300 0" dur="86s" repeatCount="indefinite" begin="-24s"/>
        <g transform="translate(0 335)">
          <path d="M0 0 q 5 -4 10 0 q 5 -4 10 0" opacity=".85"/>
        </g>
      </g>
    </g>

    <!-- hills -->
    <g id="hills">
      <path d="M-900 545 L-900 500 C -700 440 -500 488 -300 492 C -100 496 60 468 240 480 C 420 492 560 452 760 468 C 960 484 1120 462 1300 488 C 1500 514 1700 488 1900 506 L1900 545 Z" fill="#b9dc9a"/>
      <path d="M-900 545 L-900 523 C -700 485 -480 529 -260 521 C -40 513 140 537 340 527 C 540 517 720 537 920 527 C 1120 517 1320 539 1520 529 C 1680 521 1820 529 1900 525 L1900 545 Z" fill="#8ec46d"/>
      <path d="M-900 545 L-900 537 C -600 529 -300 543 0 539 C 300 535 600 545 900 541 C 1200 537 1500 545 1900 539 L1900 545 Z" fill="#6fae4f"/>
      <g fill="#4c8a3a" opacity=".75">
        <ellipse cx="150" cy="525" rx="26" ry="10"/>
        <ellipse cx="176" cy="529" rx="18" ry="8"/>
        <ellipse cx="980" cy="521" rx="30" ry="11"/>
      </g>
    </g>

    <!-- grass at the horizon -->
    <g id="grassBack"></g>

    <!-- soil cross-section -->
    <g id="soilLayer">
      <rect x="-900" y="545" width="2800" height="500" fill="url(#soil)"/>
      <rect x="-900" y="545" width="2800" height="22" fill="url(#topsoil)"/>
      <rect x="-900" y="545" width="2800" height="2" fill="#c8a06a" opacity=".35"/>
      <path d="M-900 640 C -600 630 -300 648 0 642 C 300 636 600 650 900 644 C 1200 638 1500 650 1900 641" fill="none" stroke="#1c0f06" stroke-width="2" opacity=".16"/>
      <path d="M-900 715 C -600 707 -300 722 0 716 C 300 710 600 724 900 718 C 1200 712 1500 724 1900 716" fill="none" stroke="#1c0f06" stroke-width="2" opacity=".12"/>
      <g id="speckles"></g>
    </g>

    <!-- soft shadow under the plant -->
    <ellipse id="shadow" cx="548" cy="548" rx="30" ry="7" fill="#1a2410" opacity=".12" filter="url(#blurSmall)"/>

    <!-- the plant -->
    <g id="plant" transform="translate(560 545)">
      <g id="underground">
        <ellipse id="seedHalo" cx="0" cy="60" rx="42" ry="36" fill="url(#seedHalo)" opacity=".5"/>
        <g id="roots"></g>
        <g id="seed">
          <ellipse cx="0" cy="58" rx="12" ry="18" transform="rotate(-24 0 58)" fill="url(#seedGrad)" stroke="#2c1a0c" stroke-width="1.2"/>
          <path d="M-7 51 C -1 54 3 60 2 67" stroke="#e8d8b0" stroke-width="1.5" fill="none" opacity=".55" stroke-linecap="round"/>
          <path d="M-8 61 C -3 64 0 68 1 72" stroke="#e8d8b0" stroke-width="1" fill="none" opacity=".32" stroke-linecap="round"/>
          <path d="M3 49 C 7 54 8 60 7 66" stroke="#2c1a0c" stroke-width="1" fill="none" opacity=".35" stroke-linecap="round"/>
        </g>
      </g>

      <g id="sway">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; 0.9 0 0; 0.2 0 0; -0.5 0 0; 0 0 0" keyTimes="0;0.28;0.52;0.76;1" dur="12s" repeatCount="indefinite"/>
        <g id="stemGroup">
          <path id="stem" d="M0 62" fill="none" stroke="url(#stemGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="stemHi" d="M0 62" fill="none" stroke="#a9d77e" stroke-width="2.6" stroke-linecap="round" opacity=".35"/>
        </g>
        <g id="cotyledons"></g>
        <g id="leaves"></g>

        <g id="headWrap" opacity="0">
          <g id="headPos">
            <g id="headScale">
              <circle id="headGlow" r="215" fill="url(#flowerGlow)" opacity="0"/>
              <g id="sepals"></g>
              <g id="petalsOuter"></g>
              <g id="petalsInner"></g>
              <g id="bud" opacity="1">
                <path d="M0 -60 C 14 -54 22 -34 22 -12 C 22 16 12 34 0 38 C -12 34 -22 16 -22 -12 C -22 -34 -14 -54 0 -60 Z" fill="url(#budGrad)" stroke="#2f5c1f" stroke-width="1.2" stroke-linejoin="round"/>
                <path d="M0 -54 C 5 -34 5 -6 0 30" fill="none" stroke="#2f5c1f" stroke-width="1" opacity=".3"/>
                <path d="M-10 -46 C -5 -28 -7 -6 -4 24" fill="none" stroke="#2f5c1f" stroke-width="1" opacity=".25"/>
                <path d="M10 -46 C 5 -28 7 -6 4 24" fill="none" stroke="#2f5c1f" stroke-width="1" opacity=".25"/>
                <path d="M-3 -53 C 4 -57 10 -54 13 -47" fill="none" stroke="#ffe9a1" stroke-width="2" opacity=".35" stroke-linecap="round"/>
                <path d="M-12 -46 C -6 -54 6 -54 12 -46 C 6 -50 -6 -50 -12 -46 Z" fill="#e9dc7a" opacity=".28"/>
              </g>
              <circle id="disc" r="0" fill="url(#discGrad)" stroke="#3a1e0a" stroke-width="1.5" opacity=".96"/>
              <g id="seedField"></g>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- foreground tufts -->
    <g id="grassFront"></g>

    <!-- bees -->
    <g id="bees" opacity="0">
      <g>
        <animateMotion dur="16s" repeatCount="indefinite" rotate="auto">
          <mpath href="#beePath"/>
        </animateMotion>
        <ellipse cx="0" cy="0" rx="7.5" ry="5.5" fill="#f4c445"/>
        <path d="M-7.5 0 H7.5" stroke="#2a1a0a" stroke-width="1.4" opacity=".6"/>
        <path d="M-2.5 -5.4 V5.4" stroke="#2a1a0a" stroke-width="1.2" opacity=".5"/>
        <path d="M2.5 -5.4 V5.4" stroke="#2a1a0a" stroke-width="1.2" opacity=".5"/>
        <ellipse cx="-1" cy="-4.5" rx="4.6" ry="2.8" fill="#eaf6ff" opacity=".75" transform="rotate(-20)"/>

      <g transform="scale(.8)">
        <animateMotion dur="23s" repeatCount="indefinite" rotate="auto" begin="-8s">

        <ellipse cx="0" cy="0" rx="7.5" ry="5.5" fill="#f4c445"/>
        <path d="M-7.5 0 H7.5" stroke="#2a1a0a" stroke-width="1.4" opacity=".6"/>
        <path d="M-2.5 -5.4 V5.4" stroke="#2a1a0a" stroke-width="1.2" opacity=".5"/>
        <path d="M2.5 -5.4 V5.4" stroke="#2a1a0a" stroke-width="1.2" opacity=".5"/>
        <ellipse cx="-1" cy="-4.5" rx="4.6" ry="2.8" fill="#eaf6ff" opacity=".75" transform="rotate(-20)"/>
        <ellipse cx="-1" cy="4.5" rx="4.2" ry="2.4" fill="#eaf6ff" opacity=".6" transform="rotate(20)"/>

  <header class="hud">

        <circle cx="12" cy="12" r="3.6" fill="#5a3a12"/>

        <svg class="ic ic-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.6" height="14" rx="1.6" fill="currentColor"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.6" fill="currentColor"/></svg>
      </button>
      <button id="replayBtn" class="btn" type="button" aria-label="Xem lại từ đầu">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">

          <path d="M12 2.3v5.4L7.3 5z" fill="currentColor"/>

      <div class="track" id="track" role="slider" tabindex="0" aria-label="Tiến trình sinh trưởng" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">

        <div class="fill" id="fill"></div>

      </div>

  <noscript>
    <div style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.85);font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#20301f;text-align:center;padding:24px">
      Bật JavaScript để xem mô phỏng hoa hướng dương từ hạt đến nở rộ.
    </div>
  </noscript>
</div>

<script>
(() => {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const easeInOut = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);

  function svgEl(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ------------------------------------------------------------------ *
   *  Geometry of the plant (local coordinates, origin = stem base)      *
   * ------------------------------------------------------------------ */
  const H = 360;        // stem height above the base
  const SEED_Y = 62;    // seed depth below the base
  const stemPoint = (u) => [
    20 * Math.sin(u * Math.PI * 1.15) + 4 * u,
    SEED_Y - (H + SEED_Y) * u
  ];

  const scene   = $('scene');
  const stemEl  = $('stem');
  const stemHi  = $('stemHi');
  const headWrap = $('headWrap');
  const headPos = $('headPos');
  const headScale = $('headScale');
  const headGlow = $('headGlow');
  const budEl   = $('bud');
  const discEl  = $('disc');
  const seedField = $('seedField');
  const shadowEl = $('shadow');
  const seedHaloEl = $('seedHalo');
  const beesEl  = $('bees');
  const pollenEl = $('pollen');
  const capEl   = $('caption');
  const playBtn = $('playBtn');
  const replayBtn = $('replayBtn');
  const track   = $('track');
  const fillEl  = $('fill');
  const thumbEl = $('thumb');
  const pctEl   = $('pct');
  const dayEl   = $('dayNum');
  const stagesHost = $('stages');

  /* ------------------------------------------------------------------ *
   *  Decorative layers                                                 *
   * ------------------------------------------------------------------ */
  (function sunRays() {
    const g = $('sunRays');
    for (let i = 0; i < 28; i++) {
      const a = (i / 28) * Math.PI * 2;
      const r1 = 72;
      const r2 = 94 + (i % 4) * 7;
      svgEl('line', {
        x1: (940 + Math.cos(a) * r1).toFixed(1), y1: (150 + Math.sin(a) * r1).toFixed(1),
        x2: (940 + Math.cos(a) * r2).toFixed(1), y2: (150 + Math.sin(a) * r2).toFixed(1)
      }, g);
    }
  })();

  (function grass() {
    const back = $('grassBack');
    const front = $('grassFront');
    const rnd = mulberry32(20261017);
    const palette = ['#3f7d2b', '#4f9235', '#64a845', '#356b25', '#77b955'];

    for (let x = -900; x < 1900; x += 11 + rnd() * 11) {
      const h = 6 + rnd() * 16;
      const lean = (rnd() * 2 - 1) * 0.6;
      const d = `M0 0 C ${(-2 + lean * 3).toFixed(1)} ${(-h * .35).toFixed(1)} ${(1 + lean * 3).toFixed(1)} ${(-h * .7).toFixed(1)} ${(lean * h * .55).toFixed(1)} ${(-h).toFixed(1)}`;
      const g = svgEl('g', { transform: `translate(${x.toFixed(1)} 546)` }, back);
      svgEl('path', {
        d, fill: 'none', stroke: palette[Math.floor(rnd() * palette.length)],
        'stroke-width': (1.1 + rnd() * 1.4).toFixed(1), 'stroke-linecap': 'round',
        opacity: (0.55 + rnd() * 0.45).toFixed(2)
      }, g);
      const a = svgEl('animateTransform', {
        attributeName: 'transform', type: 'rotate',
        values: `0 0 0; ${(0.6 + rnd() * 1.6).toFixed(2)} 0 0; 0 0 0; ${(-0.4 - rnd() * 1.2).toFixed(2)} 0 0; 0 0 0`,
        dur: (4 + rnd() * 4).toFixed(1) + 's', repeatCount: 'indefinite'
      }, g);
      a.setAttribute('begin', (-rnd() * 8).toFixed(1) + 's');
    }

    for (let i = 0; i < 30; i++) {
      const x = 400 + rnd() * 330;
      const h = 10 + rnd() * 20;
      const lean = (rnd() * 2 - 1) * 0.8;
      const d = `M0 0 C ${(-3 + lean * 4).toFixed(1)} ${(-h * .4).toFixed(1)} ${(2 + lean * 4).toFixed(1)} ${(-h * .75).toFixed(1)} ${(lean * h * .6).toFixed(1)} ${(-h).toFixed(1)}`;
      const g = svgEl('g', { transform: `translate(${x.toFixed(1)} 547)` }, front);
      svgEl('path', {
        d, fill: 'none', stroke: palette[Math.floor(rnd() * palette.length)],
        'stroke-width': (1.3 + rnd() * 1.5).toFixed(1), 'stroke-linecap': 'round',
        opacity: (0.5 + rnd() * 0.4).toFixed(2)
      }, g);
      const a = svgEl('animateTransform', {
        attributeName: 'transform', type: 'rotate',
        values: `0 0 0; ${(0.8 + rnd() * 2).toFixed(2)} 0 0; 0 0 0; ${(-0.5 - rnd() * 1.4).toFixed(2)} 0 0; 0 0 0`,
        dur: (3.6 + rnd() * 3.6).toFixed(1) + 's', repeatCount: 'indefinite'
      }, g);
      a.setAttribute('begin', (-rnd() * 7).toFixed(1) + 's');
    }
  })();

  (function soilSpeckles() {
    const host = $('speckles');
    const rnd = mulberry32(777001);
    for (let i = 0; i < 260; i++) {
      const x = -900 + rnd() * 2800;
      const y = 552 + rnd() * 328;
      const light = rnd() > 0.52;
      svgEl('circle', {
        cx: x.toFixed(1), cy: y.toFixed(1), r: (0.6 + rnd() * 2.1).toFixed(2),
        fill: light ? '#9a7448' : '#241408', opacity: (0.1 + rnd() * 0.3).toFixed(2)
      }, host);
    }
    for (let i = 0; i < 16; i++) {
      const x = -700 + rnd() * 2500;
      const y = 620 + rnd() * 220;
      svgEl('ellipse', {
        cx: x.toFixed(1), cy: y.toFixed(1), rx: (3 + rnd() * 6).toFixed(1), ry: (2 + rnd() * 3).toFixed(1),
        fill: '#6d5236', opacity: (0.22 + rnd() * 0.25).toFixed(2)
      }, host);
    }
  })();

  /* ------------------------------------------------------------------ *
   *  Plant pieces                                                      *
   * ------------------------------------------------------------------ */
  const PETAL_D = 'M0 0 C -13 -16 -19 -44 -10 -69 C -5 -84 -2 -96 0 -104 C 2 -96 5 -84 10 -69 C 19 -44 13 -16 0 0 Z';
  const petalGroups = [];
  function buildPetalRing(host, n, ring) {
    for (let i = 0; i < n; i++) {
      const g = svgEl('g', { class: 'petal' }, host);
      g.dataset.i = i; g.dataset.n = n; g.dataset.ring = ring;
      svgEl('path', {
        d: PETAL_D,
        fill: `url(#${ring === 'i' ? 'petalGradIn' : 'petalGrad'})`,
        stroke: 'rgba(190,116,6,.38)', 'stroke-width': '1', 'stroke-linejoin': 'round'
      }, g);
      petalGroups.push(g);
    }
  }
  buildPetalRing($('petalsOuter'), 26, 'o');
  buildPetalRing($('petalsInner'), 16, 'i');

  (function sepals() {
    const host = $('sepals');
    const SEPAL_D = 'M0 0 C -6 -12 -5 -24 0 -34 C 5 -24 6 -12 0 0 Z';
    const n = 9;
    for (let i = 0; i < n; i++) {
      svgEl('path', {
        d: SEPAL_D, fill: '#4d8b31', stroke: '#2f5c1f', 'stroke-width': '.8',
        transform: `rotate(${(i * 360 / n).toFixed(1)}) translate(0 -6) scale(1.02)`,
        opacity: '.92'
      }, host);
    }
  })();

  (function seeds() {
    const field = $('seedField');
    const N = 170;
    const GA = Math.PI * (3 - Math.sqrt(5)); // golden angle
    const shades = ['#ffd873', '#f2ab3c', '#caa14e'];
    for (let i = 0; i < N; i++) {
      const r = Math.sqrt((i + 0.5) / N) * 41;
      const a = i * GA;
      svgEl('circle', {
        cx: (Math.cos(a) * r).toFixed(2), cy: (Math.sin(a) * r).toFixed(2),
        r: (1.05 + 1.7 * (1 - r / 41)).toFixed(2),
        fill: shades[i % shades.length], opacity: '.92'
      }, field);
    }
  })();

  const LEAF_D = 'M0 0 C 12 -9 34 -19 60 -22 C 86 -25 108 -14 118 2 C 104 13 76 18 50 14 C 27 10 9 5 0 0 Z';
  const LEAF_VEINS = [
    'M4 0 C 42 -3 82 -8 114 2',
    'M26 -4 C 34 -11 42 -16 50 -20',
    'M48 -5 C 58 -13 68 -18 78 -20',
    'M72 -6 C 82 -12 92 -15 100 -16',
    'M30 -1 C 40 6 52 10 62 12',
    'M56 -1 C 66 6 78 10 88 11'
  ];
  const LEAF_CFG = [
    { u: .33, side: 1,  s: 1.00, lean: 20 },
    { u: .33, side: -1, s: .94,  lean: 20 },
    { u: .50, side: -1, s: .86,  lean: 18 },
    { u: .50, side: 1,  s: .80,  lean: 18 },
    { u: .67, side: 1,  s: .68,  lean: 16 },
    { u: .67, side: -1, s: .64,  lean: 16 },
    { u: .81, side: -1, s: .46,  lean: 14 },
    { u: .81, side: 1,  s: .44,  lean: 14 }
  ];
  const leafEls = [];
  (function buildLeaves() {
    const host = $('leaves');
    const rnd = mulberry32(5150);
    LEAF_CFG.forEach((cfg) => {
      const g = svgEl('g', { class: 'leaf', opacity: '0' }, host);
      const inner = svgEl('g', {}, g);
      svgEl('path', {
        d: LEAF_D, fill: 'url(#leafGrad)', stroke: '#2f611f', 'stroke-width': '.9', 'stroke-linejoin': 'round'
      }, inner);
      LEAF_VEINS.forEach((d, i) => {
        svgEl('path', {
          d, fill: 'none', stroke: i === 0 ? 'rgba(29,66,16,.55)' : 'rgba(29,66,16,.3)',
          'stroke-width': i === 0 ? '1.5' : '1', 'stroke-linecap': 'round'
        }, inner);
      });
      const a = svgEl('animateTransform', {
        attributeName: 'transform', type: 'rotate',
        values: `0 0 0; ${(0.9 + rnd() * 1.1).toFixed(2)} 0 0; 0 0 0; ${(-0.6 - rnd() * 0.9).toFixed(2)} 0 0; 0 0 0`,
        dur: (4.6 + rnd() * 3.4).toFixed(1) + 's', repeatCount: 'indefinite'
      }, inner);
      a.setAttribute('begin', (-rnd() * 6).toFixed(1) + 's');
      leafEls.push(g);
    });
  })();

  const COTY_CFG = [{ side: 1 }, { side: -1 }];
  const cotyEls = [];
  (function buildCotyledons() {
    const host = $('cotyledons');
    const COTY_D = 'M0 0 C 8 -4 21 -8 34 -7 C 28 5 11 9 0 0 Z';
    COTY_CFG.forEach((cfg) => {
      const g = svgEl('g', { class: 'coty', opacity: '0' }, host);
      g.dataset.side = cfg.side;
      svgEl('path', {
        d: COTY_D, fill: '#8bd06a', stroke: '#4c8a30', 'stroke-width': '.8',
        'stroke-linejoin': 'round'
      }, g);
      svgEl('path', {
        d: 'M2 -1 C 12 -4 24 -5 32 -5', fill: 'none', stroke: 'rgba(40,90,25,.4)',
        'stroke-width': '.9', 'stroke-linecap': 'round'
      }, g);
      cotyEls.push(g);
    });
  })();

  const ROOT_D = [
    'M0 64 C 5 76 1 90 7 104',
    'M2 72 C -12 80 -20 90 -24 102',
    'M3 82 C 18 90 23 98 26 108',
    'M1 94 C -10 100 -15 104 -18 108',
    'M5 98 C 13 104 16 108 18 112',
    'M0 102 C -4 106 -5 110 -4 114',
    'M3 84 C -9 88 -15 94 -17 100',
    'M6 92 C 14 97 16 102 17 108',
    'M-1 78 C -8 84 -11 90 -12 96'
  ];
  const rootEls = [];
  (function buildRoots() {
    const host = $('roots');
    ROOT_D.forEach((d) => {
      const p = svgEl('path', {
        d, fill: 'none', stroke: '#d9c9a6', 'stroke-width': '2.6',
        'stroke-linecap': 'round', opacity: '0'
      }, host);
      const len = p.getTotalLength();
      p.__len = len;
      p.setAttribute('stroke-dasharray', len.toFixed(1));
      p.setAttribute('stroke-dashoffset', len.toFixed(1));
      rootEls.push(p);
    });
  })();

  (function pollenMotes() {
    const host = $('pollen');
    const rnd = mulberry32(4242);
    for (let i = 0; i < 18; i++) {
      const x = 420 + rnd() * 290;
      const y = 180 + rnd() * 240;
      const c = svgEl('circle', {
        cx: x.toFixed(1), cy: y.toFixed(1), r: (1 + rnd() * 2.1).toFixed(2),
        fill: i % 4 === 0 ? '#fff3c4' : '#ffd76e', class: 'mote'
      }, host);
      c.style.setProperty('--dx', ((rnd() * 2 - 1) * 70).toFixed(0) + 'px');
      c.style.setProperty('--dy', (-120 - rnd() * 140).toFixed(0) + 'px');
      c.style.setProperty('--dur', (6 + rnd() * 5).toFixed(1) + 's');
      c.style.setProperty('--delay', (-rnd() * 8).toFixed(1) + 's');
    }
  })();

  /* ------------------------------------------------------------------ *
   *  Timeline                                                          *
   * ------------------------------------------------------------------ */
  const STAGES = [
    { name: 'Hạt',      at: 0.00, cap: 'Một hạt nhỏ nằm im trong lòng đất ẩm, chờ ngày nứt vỏ.' },
    { name: 'Nảy mầm',  at: 0.11, cap: 'Rễ mầm len lỏi xuống sâu, tìm nước và dưỡng chất.' },
    { name: 'Mầm',      at: 0.23, cap: 'Chồi non nhú lên, hai lá mầm mở ra đón ánh sáng đầu tiên.' },
    { name: 'Vươn cao', at: 0.37, cap: 'Thân vươn thẳng, từng đôi lá xanh xòe rộng đón nắng.' },
    { name: 'Nụ hoa',   at: 0.62, cap: 'Nụ xanh khép mình, ôm ấp những cánh hoa bên trong.' },
    { name: 'Nở rộ',    at: 0.82, cap: 'Từng cánh vàng bung nở, hướng về phía mặt trời.' }
  ];

  const state = {
    p: 0,
    playing: true,
    scrubbing: false,
    duration: 14,
    stage: -1
  };
  let capTimer = 0;

  /* ------------------------------------------------------------------ *
   *  Render                                                            *
   * ------------------------------------------------------------------ */
  function render(p) {
    const prog = clamp(p);
    const g = easeInOut(clamp((prog - 0.10) / 0.55));

    /* stem */
    const segs = Math.max(2, Math.ceil(56 * Math.max(g, 0.004)));
    let d = '';
    for (let i = 0; i <= segs; i++) {
      const u = g * i / segs;
      const pt = stemPoint(u);
      d += (i ? 'L' : 'M') + pt[0].toFixed(2) + ' ' + pt[1].toFixed(2);
      if (i < segs) d += ' ';
    }
    stemEl.setAttribute('d', d);
    stemHi.setAttribute('d', d);

    seedHaloEl.setAttribute('opacity', (0.55 * (1 - smooth(0.16, 0.55, prog))).toFixed(3));

    /* roots */
    const rootP = clamp((prog - 0.02) / 0.28);
    rootEls.forEach((r, i) => {
      const pr = clamp((rootP - i * 0.045) / 0.7);
      r.setAttribute('stroke-dashoffset', (r.__len * (1 - pr)).toFixed(1));
      r.style.opacity = pr > 0.01 ? '1' : '0';
    });

    /* cotyledons (seed leaves near the ground) */
    const cotyPt = stemPoint(0.185);
    const cotyApp = smooth(0.185, 0.27, g);
    cotyEls.forEach((c) => {
      const side = c.dataset.side === '1' ? 1 : -1;
      const theta = side === 1 ? -62 : 62;
      const sc = 0.55 * cotyApp;
      c.setAttribute('transform',
        `translate(${cotyPt[0].toFixed(2)} ${cotyPt[1].toFixed(2)}) rotate(${theta}) scale(${(side * sc).toFixed(4)} ${sc.toFixed(4)})`);
      c.style.opacity = cotyApp > 0.02 ? '1' : '0';
    });

    /* true leaves */
    leafEls.forEach((l, i) => {
      const cfg = LEAF_CFG[i];
      const app = smooth(cfg.u, cfg.u + 0.10, g);
      const pt = stemPoint(cfg.u);
      const theta = cfg.side === 1 ? -cfg.lean : cfg.lean;
      const s = cfg.s * (0.10 + 0.90 * app);
      const rot = theta * (1.55 - 0.55 * app);
      l.setAttribute('transform',
        `translate(${pt[0].toFixed(2)} ${pt[1].toFixed(2)}) rotate(${rot.toFixed(2)}) scale(${(cfg.side * s).toFixed(4)} ${s.toFixed(4)})`);
      l.style.opacity = app > 0.01 ? '1' : '0';
    });

    /* flower head position + size */
    const tip = stemPoint(Math.min(g, 1));
    const headApp = smooth(0.44, 0.53, prog);
    headWrap.setAttribute('opacity', headApp.toFixed(3));
    headPos.setAttribute('transform', `translate(${tip[0].toFixed(2)} ${tip[1].toFixed(2)}) rotate(8)`);
    const hs = 0.20 + 0.80 * easeOut(smooth(0.44, 0.72, prog));
    headScale.setAttribute('transform', `scale(${hs.toFixed(4)})`);

    /* petals open with a gentle stagger */
    for (const pg of petalGroups) {
      const i = +pg.dataset.i;
      const n = +pg.dataset.n;
      const inner = pg.dataset.ring === 'i';
      const start = 0.70 + (inner ? 0.008 : 0) + 0.034 * (i / n);
      const bi = smooth(start, start + 0.12, prog);
      const ang = i * (360 / n) + (inner ? 180 / n : 0);
      const base = inner ? 23 : 30;
      const lenVar = 0.94 + 0.06 * Math.abs(Math.sin(i * 1.7));
      const sc = (inner ? 0.74 : 1) * (0.16 + 0.84 * bi) * lenVar;
      pg.setAttribute('transform',
        `rotate(${ang.toFixed(2)}) translate(0 ${(-(base + 7 * bi)).toFixed(2)}) scale(${sc.toFixed(4)})`);
      pg.setAttribute('opacity', smooth(0, 0.2, bi).toFixed(3));
    }

    /* bud folds away, disc + seeds appear */
    budEl.setAttribute('opacity', (1 - smooth(0.70, 0.79, prog)).toFixed(3));
    const dr = 46 * smooth(0.72, 0.82, prog);
    discEl.setAttribute('r', dr.toFixed(2));
    discEl.setAttribute('stroke-width', dr > 1 ? '1.5' : '0');
    seedField.setAttribute('transform', `scale(${(dr / 46).toFixed(4)})`);
    seedField.setAttribute('opacity', smooth(0.75, 0.88, prog).toFixed(3));

    /* ambient light + life */
    headGlow.setAttribute('opacity', (0.55 * smooth(0.72, 0.92, prog)).toFixed(3));
    beesEl.setAttribute('opacity', smooth(0.85, 0.93, prog).toFixed(3));
    pollenEl.setAttribute('opacity', smooth(0.88, 0.96, prog).toFixed(3));

    /* base shadow grows with the plant */
    shadowEl.setAttribute('rx', (22 + 68 * g).toFixed(1));
    shadowEl.setAttribute('ry', (5 + 4 * g).toFixed(1));
    shadowEl.setAttribute('opacity', (0.10 + 0.14 * g).toFixed(3));
  }

  /* ------------------------------------------------------------------ *
   *  HUD / interactions                                                *
   * ------------------------------------------------------------------ */
  const stageBtns = [];
  STAGES.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'stage-item';
    b.innerHTML = `<span class="dot"></span><span class="name">${s.name}</span>`;
    b.addEventListener('click', () => {
      state.playing = true;
      updatePlay();
      setP(i === STAGES.length - 1 ? 0.985 : s.at + 0.015);
    });
    stagesHost.appendChild(b);
    stageBtns.push(b);
  });

  function updatePlay() {
    playBtn.classList.toggle('playing', state.playing);
    playBtn.setAttribute('aria-pressed', String(state.playing));
    playBtn.setAttribute('aria-label', state.playing ? 'Tạm dừng' : 'Phát');
  }

  function updateUI(p) {
    const pct = Math.round(p * 100);
    fillEl.style.width = (p * 100).toFixed(2) + '%';
    thumbEl.style.left = (p * 100).toFixed(2) + '%';
    pctEl.textContent = pct + '%';
    dayEl.textContent = String(Math.round(p * 75)).padStart(2, '0');
    track.setAttribute('aria-valuenow', String(pct));

    let idx = 0;
    for (let i = 0; i < STAGES.length; i++) if (p >= STAGES[i].at) idx = i;
    if (idx !== state.stage) {
      state.stage = idx;
      stageBtns.forEach((b, i) => {
        b.classList.toggle('active', i === idx);
        b.classList.toggle('done', i < idx);
      });
      clearTimeout(capTimer);
      capEl.style.opacity = '0';
      capTimer = setTimeout(() => {
        capEl.textContent = STAGES[idx].cap;
        capEl.style.opacity = '1';
      }, 170);
    }
  }

  function setP(v) {
    state.p = clamp(v);
    render(state.p);
    updateUI(state.p);
  }

  function seekAt(clientX) {
    const r = track.getBoundingClientRect();
    setP((clientX - r.left) / r.width);
  }

  playBtn.addEventListener('click', () => {
    if (state.p >= 1) { setP(0); state.playing = true; }
    else state.playing = !state.playing;
    updatePlay();
  });
  replayBtn.addEventListener('click', () => {
    state.playing = true;
    updatePlay();
    setP(0);
  });

  track.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    state.scrubbing = true;
    state.wasPlaying = state.playing;
    state.playing = false;
    updatePlay();
    track.setPointerCapture(e.pointerId);
    seekAt(e.clientX);
  });
  track.addEventListener('pointermove', (e) => {
    if (state.scrubbing) seekAt(e.clientX);
  });
  function endScrub() {
    if (!state.scrubbing) return;
    state.scrubbing = false;
    if (state.wasPlaying && state.p < 1) state.playing = true;
    updatePlay();
  }
  track.addEventListener('pointerup', endScrub);
  track.addEventListener('pointercancel', endScrub);

  window.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.code === 'Space') {
      if (e.target instanceof HTMLButtonElement) return;
      e.preventDefault();
      playBtn.click();
    } else if (e.key === 'r' || e.key === 'R') {
      replayBtn.click();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      state.playing = false; updatePlay(); setP(state.p + 0.02);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      state.playing = false; updatePlay(); setP(state.p - 0.02);
    }
  });

  /* ------------------------------------------------------------------ *
   *  Responsive viewBox — keeps the plant framed on any screen          *
   * ------------------------------------------------------------------ */
  function fit() {
    const aspect = window.innerWidth / window.innerHeight;
    if (aspect < 0.95) {
      // portrait: shift the whole scene down so the headline clears the flower
      const vh = 940, vw = vh * aspect;
      const x = 560 - vw / 2;
      scene.setAttribute('viewBox', `${x.toFixed(1)} -90 ${vw.toFixed(1)} ${vh}`);
    } else {
      const vh = 820;
      const vw = clamp(vh * aspect, 1000, 1900);
      const x = 560 - vw / 2;
      scene.setAttribute('viewBox', `${x.toFixed(1)} 0 ${vw.toFixed(1)} ${vh}`);
    }
  }
  window.addEventListener('resize', fit);
  fit();

  /* ------------------------------------------------------------------ *
   *  Boot                                                              *
   * ------------------------------------------------------------------ */
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.08, Math.max(0, (now - lastT) / 1000));
    lastT = now;
    if (state.playing && !state.scrubbing) {
      setP(state.p + dt / state.duration);
      if (state.p >= 1) { state.playing = false; updatePlay(); }
    }
    requestAnimationFrame(frame);
  }

  const params = new URLSearchParams(location.search);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (params.has('p')) {
    state.playing = false;
    setP(parseFloat(params.get('p')) || 0);
  } else if (reduce) {
    state.playing = false;
    setP(1);
  } else {
    setP(0);
    state.playing = true;
  }
  updatePlay();
  updateUI(state.p);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
