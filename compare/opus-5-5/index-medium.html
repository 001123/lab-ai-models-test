<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoa hướng dương – từ hạt tới lớn</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1d2433;
    color: #f3efe2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px;
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; letter-spacing: .5px; }
  .sub { margin: 0 0 16px; opacity: .7; font-size: .95rem; }
  .stage-wrap {
    width: min(960px, 100%);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  svg { display: block; width: 100%; height: auto; }
  .controls {
    width: min(960px, 100%);
    display: flex;
    gap: 14px;
    align-items: center;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  button {
    background: #f5b700;
    color: #2a1d05;
    border: 0;
    border-radius: 10px;
    padding: 9px 18px;
    font-weight: 700;
    cursor: pointer;
    font-size: .95rem;
  }
  button.ghost { background: #333d52; color: #f3efe2; }
  button:hover { filter: brightness(1.08); }
  input[type=range] { flex: 1; min-width: 180px; accent-color: #f5b700; }
  select {
    background: #333d52; color: #f3efe2; border: 0; border-radius: 8px; padding: 8px;
  }
  .steps {
    width: min(960px, 100%);
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    margin-top: 16px;
  }
  .step {
    background: #2a3245;
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
    font-size: .78rem;
    opacity: .55;
    transition: all .3s;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .step b { display: block; font-size: 1.1rem; margin-bottom: 2px; }
  .step.active { opacity: 1; border-color: #f5b700; background: #3a3320; }
  .step.done { opacity: .85; }
  .desc {
    width: min(960px, 100%);
    margin-top: 14px;
    background: #2a3245;
    border-radius: 12px;
    padding: 14px 18px;
    line-height: 1.5;
    min-height: 74px;
  }
  .desc strong { color: #ffcf3a; }
  @media (max-width: 700px) {
    .steps { grid-template-columns: repeat(4, 1fr); }
  }
  .sun-rays { transform-origin: 690px 90px; animation: spin 40s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cloud { animation: drift linear infinite; }
  .cloud.c1 { animation-duration: 60s; }
  .cloud.c2 { animation-duration: 85s; animation-delay: -40s; }
  @keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(1000px); } }
</style>
</head>
<body>
  <h1>🌻 Vòng đời hoa hướng dương</h1>
  <p class="sub">Mô phỏng SVG: từ hạt giống nằm trong đất đến bông hoa trưởng thành kết hạt</p>

  <div class="stage-wrap">
    <svg id="scene" viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6fb7ff"/>
          <stop offset="1" stop-color="#d9f0ff"/>
        </linearGradient>
        <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7a4f2c"/>
          <stop offset="1" stop-color="#3f2715"/>
        </linearGradient>
        <radialGradient id="sunGrad">
          <stop offset="0" stop-color="#fff7c2"/>
          <stop offset=".6" stop-color="#ffd84a"/>
          <stop offset="1" stop-color="#ffb300"/>
        </radialGradient>
        <radialGradient id="diskGrad">
          <stop offset="0" stop-color="#6b4a1c"/>
          <stop offset=".7" stop-color="#4a2f10"/>
          <stop offset="1" stop-color="#2e1c08"/>
        </radialGradient>
        <linearGradient id="petalGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#f09a00"/>
          <stop offset=".45" stop-color="#ffc400"/>
          <stop offset="1" stop-color="#ffe066"/>
        </linearGradient>
        <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5fae3a"/>
          <stop offset="1" stop-color="#2f7a24"/>
        </linearGradient>
        <radialGradient id="budGrad" cx=".4" cy=".35">
          <stop offset="0" stop-color="#9ad35f"/>
          <stop offset="1" stop-color="#3f8a2a"/>
        </radialGradient>
        <path id="petalShape" d="M0,0 C10,-9 40,-11 58,0 C40,11 10,9 0,0Z"/>
        <path id="bractShape" d="M0,-5 L24,0 L0,5Z"/>
      </defs>

      <!-- Bầu trời -->
      <rect width="800" height="470" fill="url(#sky)"/>
      <g class="sun-rays" opacity=".55">
        <g id="rays"></g>
      </g>
      <circle cx="690" cy="90" r="42" fill="url(#sunGrad)"/>

      <g class="cloud c1" fill="#fff" opacity=".9">
        <ellipse cx="80" cy="90" rx="55" ry="20"/>
        <ellipse cx="110" cy="75" rx="35" ry="22"/>
        <ellipse cx="55" cy="80" rx="25" ry="16"/>
      </g>
      <g class="cloud c2" fill="#fff" opacity=".8">
        <ellipse cx="60" cy="170" rx="45" ry="15"/>
        <ellipse cx="85" cy="158" rx="28" ry="17"/>
      </g>

      <!-- Đồi xa -->
      <path d="M0,430 Q150,380 300,420 T620,410 T800,420 V470 H0Z" fill="#8cc56a"/>
      <path d="M0,450 Q200,420 420,450 T800,445 V470 H0Z" fill="#6aaa4a"/>

      <!-- Đất (mặt cắt) -->
      <rect y="470" width="800" height="170" fill="url(#soil)"/>
      <path d="M0,470 H800 V478 Q600,485 400,476 T0,480Z" fill="#5a8f35"/>
      <g id="pebbles" fill="#5e3d22" opacity=".8"></g>
      <line x1="0" y1="560" x2="800" y2="560" stroke="#000" stroke-opacity=".08" stroke-width="2" stroke-dasharray="6 10"/>

      <!-- Rễ -->
      <g id="roots" stroke="#e8d7b0" stroke-linecap="round" fill="none"></g>

      <!-- Vỏ hạt -->
      <g id="seed" transform="translate(400,508)">
        <g id="seedInner">
          <ellipse id="seedL" rx="8" ry="14" fill="#2b2b2b"/>
          <path d="M-4,-11 L-4,11 M0,-13 L0,13 M4,-11 L4,11" stroke="#e8e8e8" stroke-width="1.3" opacity=".75"/>
        </g>
      </g>

      <!-- Thân -->
      <path id="stem" fill="none" stroke="#4d9a2f" stroke-linecap="round"/>
      <path id="stemHi" fill="none" stroke="#8fd05d" stroke-linecap="round" opacity=".5"/>

      <!-- Lá mầm -->
      <g id="cotyledons"></g>

      <!-- Lá thật -->
      <g id="leaves"></g>

      <!-- Hoa -->
      <g id="head">
        <g id="bracts"></g>
        <g id="petalsBack"></g>
        <g id="petalsFront"></g>
        <circle id="bud" r="0" fill="url(#budGrad)"/>
        <circle id="disk" r="0" fill="url(#diskGrad)"/>
        <g id="seedsWrap"><g id="seeds"></g></g>
      </g>

      <!-- Cỏ -->
      <g id="grass" stroke="#4f8f2e" stroke-width="2" stroke-linecap="round" fill="none"></g>

      <!-- Nhãn -->
      <g font-family="system-ui, sans-serif">
        <rect x="16" y="16" width="220" height="54" rx="12" fill="#000" opacity=".35"/>
        <text id="dayLabel" x="30" y="40" fill="#fff" font-size="16" font-weight="700">Ngày 0</text>
        <text id="stageLabel" x="30" y="60" fill="#ffe27a" font-size="13">Hạt giống</text>
      </g>
    </svg>
  </div>

  <div class="controls">
    <button id="playBtn">⏸ Tạm dừng</button>
    <button id="resetBtn" class="ghost">↺ Làm lại</button>
    <input id="progress" type="range" min="0" max="1000" value="0">
    <select id="speed">
      <option value="40">Chậm</option>
      <option value="22" selected>Vừa</option>
      <option value="12">Nhanh</option>
    </select>
  </div>

  <div class="steps" id="steps"></div>
  <div class="desc" id="desc"></div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const lerp = (a, b, k) => a + (b - a) * k;
  const mixColor = (c1, c2, k) => {
    const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
    const a = p(c1), b = p(c2);
    return "#" + a.map((v, i) => Math.round(lerp(v, b[i], k)).toString(16).padStart(2, "0")).join("");
  };

  const STAGES = [
    { at: 0.00, icon: "🌰", name: "Hạt giống", day: 0,
      text: "<strong>Hạt giống</strong> được gieo sâu khoảng 3–4 cm trong đất ẩm. Hạt hút nước, trương phồng lên và bắt đầu đánh thức phôi bên trong." },
    { at: 0.07, icon: "💧", name: "Nảy mầm", day: 2,
      text: "<strong>Nảy mầm:</strong> vỏ hạt nứt ra, <strong>rễ mầm</strong> đâm xuống trước tiên để hút nước và bám chắc vào đất." },
    { at: 0.17, icon: "🌱", name: "Mọc mầm", day: 5,
      text: "<strong>Mọc mầm:</strong> thân mầm uốn cong như móc câu, đẩy lên xuyên qua mặt đất để bảo vệ đỉnh sinh trưởng non." },
    { at: 0.26, icon: "🌿", name: "Cây con", day: 8,
      text: "<strong>Cây con:</strong> hai <strong>lá mầm</strong> xòe ra đón ánh nắng và bắt đầu quang hợp. Hệ rễ phân nhánh mạnh hơn." },
    { at: 0.36, icon: "🪴", name: "Thân lá", day: 20,
      text: "<strong>Phát triển thân lá:</strong> thân vươn cao nhanh, các cặp lá thật hình tim mọc so le. Cây có thể cao thêm vài cm mỗi ngày." },
    { at: 0.62, icon: "🟢", name: "Nụ hoa", day: 45,
      text: "<strong>Nụ hoa:</strong> trên đỉnh thân hình thành nụ được bao bọc bởi các lá bắc xanh. Nụ non xoay theo hướng mặt trời." },
    { at: 0.76, icon: "🌻", name: "Nở hoa", day: 65,
      text: "<strong>Nở hoa:</strong> các cánh hoa vàng rực bung ra. Đĩa hoa ở giữa gồm hàng trăm hoa nhỏ xếp theo <strong>xoắn ốc Fibonacci</strong> (góc vàng 137,5°)." },
    { at: 0.90, icon: "🌾", name: "Kết hạt", day: 90,
      text: "<strong>Kết hạt:</strong> sau khi thụ phấn, đĩa hoa chín thành hạt màu sẫm, cánh hoa héo dần và bông hoa nặng trĩu cúi xuống. Vòng đời lại bắt đầu từ những hạt mới!" },
  ];
  const DAY_END = 100;

  // ---------- Dựng các phần tử tĩnh ----------
  const rays = $("rays");
  for (let i = 0; i < 16; i++) {
    const a = i * 22.5;
    el("path", { d: "M690,30 L684,-10 L696,-10Z", fill: "#fff3a0",
      transform: `rotate(${a} 690 90) translate(0 ${-4})` }, rays);
  }

  const pebbles = $("pebbles");
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * 800, y = 490 + Math.random() * 145;
    if (Math.abs(x - 400) < 30 && y < 530) continue;
    el("ellipse", { cx: x, cy: y, rx: 1.5 + Math.random() * 3.5, ry: 1 + Math.random() * 2.2,
      opacity: .4 + Math.random() * .6 }, pebbles);
  }

  const grass = $("grass");
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * 800;
    if (Math.abs(x - 400) < 18) continue;
    const h = 6 + Math.random() * 12, lean = (Math.random() - .5) * 8;
    el("path", { d: `M${x},474 q${lean / 2},${-h / 2} ${lean},${-h}`, opacity: .6 + Math.random() * .4 }, grass);
  }

  // Rễ: rễ chính + rễ bên
  const roots = $("roots");
  const mainRoot = el("path", { "stroke-width": 3 }, roots);
  const sideRoots = [];
  for (let i = 0; i < 9; i++) {
    const side = i % 2 ? 1 : -1;
    sideRoots.push({
      p: el("path", { "stroke-width": 1.6 }, roots),
      at: 0.2 + i * 0.085, side,
      len: 30 + Math.random() * 35,
      start: 0.22 + i * 0.035,
    });
  }

  // Lá mầm
  const cotyG = $("cotyledons");
  const cotyShape = "M0,0 C8,-12 30,-14 40,-4 C30,6 10,6 0,0Z";
  const cotyL = el("path", { d: cotyShape, fill: "#7cc04a" }, cotyG);
  const cotyR = el("path", { d: cotyShape, fill: "#7cc04a" }, cotyG);

  // Lá thật
  const leavesG = $("leaves");
  const LEAF_D = "M0,0 C6,-2 14,-4 20,-5 C30,-38 82,-34 98,-10 C84,16 36,22 20,-5";
  const VEIN_D = "M20,-5 L92,-10 M42,-8 L55,-24 M42,-7 L56,8 M62,-9 L74,-24 M62,-9 L74,5";
  const leafDefs = [
    { h: 60,  side: 1,  size: 1.15 }, { h: 95,  side: -1, size: 1.15 },
    { h: 140, side: 1,  size: 1.05 }, { h: 180, side: -1, size: 1.0 },
    { h: 218, side: 1,  size: 0.9 },  { h: 252, side: -1, size: 0.8 },
    { h: 280, side: 1,  size: 0.65 }, { h: 300, side: -1, size: 0.5 },
  ];
  const leaves = leafDefs.map(def => {
    const g = el("g", {}, leavesG);
    const blade = el("path", { d: LEAF_D, fill: "url(#leafGrad)", stroke: "#2c6a1f", "stroke-width": 1 }, g);
    el("path", { d: VEIN_D, stroke: "#bfe59a", "stroke-width": 1.1, fill: "none", opacity: .7 }, g);
    return { ...def, g, blade, phase: Math.random() * 6 };
  });

  // Lá bắc
  const bracts = $("bracts");
  const bractEls = [];
  for (let i = 0; i < 24; i++) {
    bractEls.push({ a: i * 15 + (i % 2) * 7, e: el("use", { href: "#bractShape", fill: i % 2 ? "#3d8a2a" : "#4f9f34" }, bracts) });
  }

  // Cánh hoa: hai vòng
  const petals = [];
  const mkPetals = (parent, n, offset, lenK, color) => {
    for (let i = 0; i < n; i++) {
      const e = el("use", { href: "#petalShape", fill: color, stroke: "#d98a00", "stroke-width": .6 }, parent);
      petals.push({ e, a: i * 360 / n + offset, lenK, jitter: (Math.random() - .5) * 6, wilt: Math.random() });
    }
  };
  mkPetals($("petalsBack"), 21, 360 / 42, 1.0, "#f2a900");
  mkPetals($("petalsFront"), 21, 0, 0.92, "url(#petalGrad)");

  // Hạt xoắn Fibonacci
  const seedsG = $("seeds");
  const N_SEEDS = 360, GOLD = 137.508 * Math.PI / 180;
  const seedEls = [];
  for (let i = 0; i < N_SEEDS; i++) {
    const r = 46 * Math.sqrt((i + .5) / N_SEEDS);
    const a = i * GOLD;
    seedEls.push({ e: el("circle", { cx: r * Math.cos(a), cy: r * Math.sin(a), r: 1.3 + r * 0.028 }, seedsG), r });
  }

  // Các bước
  const stepsEl = $("steps");
  const stepEls = STAGES.map((s, i) => {
    const d = document.createElement("div");
    d.className = "step";
    d.innerHTML = `<b>${s.icon}</b>${s.name}`;
    d.onclick = () => { t = s.at + 0.001; playing = false; updateBtn(); };
    stepsEl.appendChild(d);
    return d;
  });

  // ---------- Hình học thân ----------
  const BASE = { x: 400, y: 508 };
  const GROUND = 470;
  let bez = null;
  const bezPoint = u => {
    const [p0, p1, p2, p3] = bez, m = 1 - u;
    return {
      x: m*m*m*p0.x + 3*m*m*u*p1.x + 3*m*u*u*p2.x + u*u*u*p3.x,
      y: m*m*m*p0.y + 3*m*m*u*p1.y + 3*m*u*u*p2.y + u*u*u*p3.y,
    };
  };
  const bezTangent = u => {
    const [p0, p1, p2, p3] = bez, m = 1 - u;
    return {
      x: 3*m*m*(p1.x-p0.x) + 6*m*u*(p2.x-p1.x) + 3*u*u*(p3.x-p2.x),
      y: 3*m*m*(p1.y-p0.y) + 6*m*u*(p2.y-p1.y) + 3*u*u*(p3.y-p2.y),
    };
  };
  const pointAtY = y => {
    let lo = 0, hi = 1;
    for (let i = 0; i < 18; i++) {
      const mid = (lo + hi) / 2;
      if (bezPoint(mid).y > y) lo = mid; else hi = mid;
    }
    return bezPoint((lo + hi) / 2);
  };

  // ---------- Vẽ theo tiến trình t ∈ [0,1] ----------
  function render(t, time) {
    // Hạt trương nước
    const swell = ease(seg(t, 0, .07));
    const crack = ease(seg(t, .07, .14));
    const seedFade = 1 - seg(t, .45, .6);
    $("seedInner").setAttribute("transform",
      `rotate(${lerp(-15, 25, crack)}) scale(${1 + .25 * swell}) translate(${crack * 6},${crack * 3})`);
    $("seed").setAttribute("opacity", seedFade);
    $("seedL").setAttribute("fill", mixColor("#2b2b2b", "#6b5a45", seg(t, .3, .55)));

    // Rễ chính
    const rootLen = 110 * ease(seg(t, .07, .5));
    const rootW = 2 + 2.5 * seg(t, .3, .8);
    mainRoot.setAttribute("stroke-width", rootW);
    if (rootLen > .5) {
      mainRoot.setAttribute("d",
        `M${BASE.x},${BASE.y} C${BASE.x - 4},${BASE.y + rootLen * .35} ${BASE.x + 6},${BASE.y + rootLen * .7} ${BASE.x - 2},${BASE.y + rootLen}`);
    } else mainRoot.setAttribute("d", "");
    sideRoots.forEach(r => {
      const k = ease(seg(t, r.start, r.start + .25));
      const y0 = BASE.y + 110 * r.at * ease(seg(t, .07, .5));
      if (k <= 0 || y0 - BASE.y > rootLen) { r.p.setAttribute("d", ""); return; }
      const L = r.len * k;
      r.p.setAttribute("d", `M${BASE.x},${y0} q${r.side * L * .5},${L * .15} ${r.side * L},${L * .55}`);
    });

    // Chiều dài thân tính từ hạt
    const s1 = ease(seg(t, .12, .2));   // dưới đất
    const s2 = ease(seg(t, .2, .3));    // trồi lên
    const s3 = ease(seg(t, .3, .68));   // vươn cao
    const L = 38 * s1 + 42 * s2 + 250 * s3;
    const hook = Math.sin(Math.PI * seg(t, .13, .29)) * (1 - seg(t, .24, .3));
    const sway = Math.sin(time * 1.1) * 5 * seg(t, .3, .7) + Math.sin(time * 2.3) * 1.2 * seg(t, .25, 1);
    const droop = ease(seg(t, .92, 1));
    const topX = BASE.x + sway + hook * 10 + droop * 14;
    const topY = BASE.y - L + hook * 14 + droop * 6;
    bez = [
      { x: BASE.x, y: BASE.y },
      { x: BASE.x - 2, y: BASE.y - L * .35 },
      { x: topX - sway * .4 + hook * 12, y: BASE.y - L * .72 },
      { x: topX, y: topY },
    ];
    const stemW = 3 + 8 * s3;
    const stemD = L > 1 ? `M${bez[0].x},${bez[0].y} C${bez[1].x},${bez[1].y} ${bez[2].x},${bez[2].y} ${bez[3].x},${bez[3].y}` : "";
    $("stem").setAttribute("d", stemD);
    $("stem").setAttribute("stroke-width", stemW);
    $("stem").setAttribute("stroke", mixColor("#e9e2c0", "#4d9a2f", seg(t, .18, .32)));
    $("stemHi").setAttribute("d", stemD);
    $("stemHi").setAttribute("stroke-width", stemW * .3);
    $("stemHi").setAttribute("transform", `translate(${-stemW * .22},0)`);

    // Lá mầm
    const cotyOpen = ease(seg(t, .24, .33));
    const cotyGrow = seg(t, .18, .24);
    const cotyAge = seg(t, .62, .85);
    if (L > 30) {
      const anchorL = Math.min(L, 95);
      const u = anchorL / L;
      const p = bezPoint(Math.min(1, u));
      const tg = bezTangent(Math.min(1, u));
      const baseAng = Math.atan2(tg.y, tg.x) * 180 / Math.PI + 90;
      const sc = (.35 + .65 * cotyOpen) * (0.6 + .4 * cotyGrow) * (1 - cotyAge * .3);
      const openAng = lerp(80, 12, cotyOpen) + cotyAge * 45;
      const col = mixColor("#7cc04a", "#c9b35a", cotyAge);
      cotyL.setAttribute("fill", col); cotyR.setAttribute("fill", col);
      cotyL.setAttribute("transform", `translate(${p.x},${p.y}) rotate(${baseAng}) rotate(${180 + openAng}) scale(${sc})`);
      cotyR.setAttribute("transform", `translate(${p.x},${p.y}) rotate(${baseAng}) rotate(${-openAng}) scale(${sc})`);
      cotyG.setAttribute("opacity", 1 - seg(t, .82, .9));
    } else cotyG.setAttribute("opacity", 0);

    // Lá thật
    const h = BASE.y - topY - (BASE.y - GROUND);
    leaves.forEach(lf => {
      const k = ease(clamp((h - lf.h - 10) / 70));
      if (k <= 0) { lf.g.setAttribute("opacity", 0); return; }
      lf.g.setAttribute("opacity", 1);
      const p = pointAtY(GROUND - lf.h);
      const flutter = Math.sin(time * 1.7 + lf.phase) * 3;
      const ang = lf.side > 0 ? -18 + (1 - k) * -50 + flutter + droop * 8 : 198 + (1 - k) * 50 - flutter - droop * 8;
      const sc = lf.size * k;
      lf.g.setAttribute("transform",
        `translate(${p.x},${p.y}) rotate(${ang}) scale(${sc},${lf.side > 0 ? sc : -sc})`);
      lf.blade.setAttribute("fill", droop > 0 && lf.h < 100 ? mixColor("#4f9a33", "#9a9a3a", droop * .7) : "url(#leafGrad)");
    });

    // Hoa
    const bud = ease(seg(t, .6, .74));
    const bloom = ease(seg(t, .76, .9));
    const ripe = ease(seg(t, .9, 1));
    const head = $("head");
    if (bud <= 0) { head.setAttribute("opacity", 0); }
    else {
      head.setAttribute("opacity", 1);
      const tg = bezTangent(1);
      const ang = Math.atan2(tg.y, tg.x) * 180 / Math.PI + 90;
      const headScale = .9 + .1 * bloom;
      head.setAttribute("transform",
        `translate(${topX},${topY}) rotate(${ang * .6 + droop * 28}) scale(${headScale},${headScale * (1 - droop * .15)})`);

      const budR = 20 * bud;
      const diskR = lerp(budR * .6, 48, bloom);

      bractEls.forEach(b => {
        const r = lerp(budR * .55, diskR * .92, bloom);
        const len = lerp(.9, 1.1, bloom) * (0.4 + .6 * bud);
        const fold = lerp(0.35, 1, bloom);
        b.e.setAttribute("transform", `rotate(${b.a}) translate(${r},0) scale(${len * fold},${len})`);
        b.e.setAttribute("fill", mixColor(b.a % 2 ? "#3d8a2a" : "#4f9f34", "#7a7a2c", ripe * .6));
      });

      $("bud").setAttribute("r", budR * (1 - bloom));
      $("disk").setAttribute("r", bloom > 0 ? diskR : 0);

      petals.forEach(p => {
        if (bloom <= 0) { p.e.setAttribute("opacity", 0); return; }
        p.e.setAttribute("opacity", 1 - ripe * .15);
        const wilt = ripe * (0.5 + p.wilt * .5);
        const len = p.lenK * lerp(.2, 1, bloom) * (1 - wilt * .45);
        const wid = lerp(.35, 1, bloom) * (1 - wilt * .5);
        const curl = wilt * 25 * (p.wilt > .5 ? 1 : -1);
        p.e.setAttribute("transform",
          `rotate(${p.a + p.jitter + curl}) translate(${diskR * .88},0) scale(${len},${wid})`);
        if (ripe > 0) p.e.setAttribute("fill", mixColor("#f2b000", "#9a6a1a", wilt));
        else p.e.setAttribute("fill", p.lenK === 1 ? "#f2a900" : "url(#petalGrad)");
      });

      const seedVis = seg(t, .8, .92);
      $("seedsWrap").setAttribute("transform", `scale(${diskR / 48})`);
      $("seedsWrap").setAttribute("opacity", seedVis);
      const flower = mixColor("#d9a520", "#7a4a18", seg(t, .84, .92));
      const seedCol = mixColor(flower, "#2a1a0c", ripe);
      const innerFront = 46 * (1 - seg(t, .82, .95));
      seedEls.forEach(s => {
        const fresh = s.r < innerFront;
        s.e.setAttribute("fill", fresh ? "#b58a2a" : seedCol);
        s.e.setAttribute("stroke", ripe > .3 ? "#c9b48a" : "none");
        s.e.setAttribute("stroke-width", .35);
      });
    }

    // Nhãn
    let idx = 0;
    STAGES.forEach((s, i) => { if (t >= s.at) idx = i; });
    const day = Math.round(t * DAY_END);
    $("dayLabel").textContent = `Ngày ${day}`;
    $("stageLabel").textContent = `${STAGES[idx].icon} ${STAGES[idx].name}`;
    stepEls.forEach((d, i) => {
      d.classList.toggle("active", i === idx);
      d.classList.toggle("done", i < idx);
    });
    if (render.lastIdx !== idx) { $("desc").innerHTML = STAGES[idx].text; render.lastIdx = idx; }
    $("progress").value = Math.round(t * 1000);
  }

  // ---------- Vòng lặp ----------
  let t = 0, playing = true, last = performance.now(), holdEnd = 0;
  const playBtn = $("playBtn");
  const updateBtn = () => playBtn.textContent = playing ? "⏸ Tạm dừng" : "▶ Phát";
  playBtn.onclick = () => { if (t >= 1) t = 0; playing = !playing; updateBtn(); };
  $("resetBtn").onclick = () => { t = 0; playing = true; holdEnd = 0; updateBtn(); };
  $("progress").oninput = e => { t = e.target.value / 1000; playing = false; updateBtn(); };

  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    if (playing) {
      const dur = +$("speed").value;
      if (t < 1) t = Math.min(1, t + dt / dur);
      else {
        holdEnd += dt;
        if (holdEnd > 3) { t = 0; holdEnd = 0; }
      }
    }
    render(t, now / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
